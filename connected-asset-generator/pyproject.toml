[project]
name = "asset-generator"
version = "0.1.0"
description = "Synthetic connected-asset operational data source for Azure Databricks POC."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "faker>=30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pyodbc>=5.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
azure = ["azure-functions>=1.21"]

[project.scripts]
asset-generator = "asset_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
